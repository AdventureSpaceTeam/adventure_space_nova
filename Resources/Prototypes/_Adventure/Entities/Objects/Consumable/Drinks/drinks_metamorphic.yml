- type: entity
  parent: DrinkGlass
  id: DrinkEngFuel
  suffix: engineering fuel
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: EngFuel
          Quantity: 30
  - type: Icon
    sprite: _Adventure/Objects/Consumable/Drinks/engfuelglass.rsi
    state: icon

