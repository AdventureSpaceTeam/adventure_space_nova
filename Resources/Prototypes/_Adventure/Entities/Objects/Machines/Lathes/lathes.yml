- type: entity
  id: EngineeringTechFab
  parent: BaseLatheLube
  name: инженерный ТехФаб
  description: Печатает снаряжение для инженерного отдела.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: engi
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - EngineeringBoardsStatic
    - CircuitFloorsStatic
    - ToolsStatic
    - PartsStatic
    - AtmosStatic
    - CablesStatic
    - MaterialsStatic
    - LightsStatic
    - PowerCellsStatic
    - ElectronicsStatic
    dynamicPacks:
    - Equipment
    - EngineeringBoards
    - PowerCells
    - AdventureSolarSail
    - AtmosTools
    - AdventureEnergyCores
    - AdventureThrusterBig
    - AdvancedTools
    - CircuitAdventureDynamic
    - ShuttleBoards
    - ContainmentFieldGenerator
  - type: Machine
    board: EngineeringTechFabCircuitboard
  - type: OreSiloClient
  - type: LatheAnnouncing
    channels: [Engineering]

- type: entity
  id: EngineeringTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: инженерный ТехФаб (машинная плата)
  description: Печатная плата инженерного ТехФаба.
  components:
    - type: Sprite
      state: engineering
    - type: MachineBoard
      prototype: EngineeringTechFab
      stackRequirements:
        Manipulator: 4
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

- type: entity
  id: CargoTechFab
  parent: BaseLatheLube
  name: ТехФаб снабжения
  description: Печатает снаряжение для отдела снабжения.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - CargoStatic
    - PartsStatic
    - PowerCellsStatic
    - MaterialsStatic
    - PaperworkStatic
    - ToolsStatic
    - CargoBoardsStatic
    dynamicPacks:
    - CargoBoards
    - Mining
    - SalvageSecurityWeapons
    - Equipment
  - type: Machine
    board: CargoTechFabCircuitboard
  - type: OreSiloClient
  - type: LatheAnnouncing
    channels: [Supply]

- type: entity
  id: CargoTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: ТехФаб снабжения (машинная плата)
  description: Печатная плата ТехФаба снабжения.
  components:
    - type: Sprite
      state: supply
    - type: MachineBoard
      prototype: CargoTechFab
      stackRequirements:
        Manipulator: 4
      tagRequirements:
        GlassBeaker:
          amount: 2
          defaultPrototype: Beaker

- type: entity
