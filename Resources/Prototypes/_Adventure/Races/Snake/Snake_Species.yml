    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      default:
      - SnakeTailBase
      limit: 1
      required: true
  onlyWhitelisted: true
  parent: Undergarments
  type: markingsGroup

- type: entity
  id: OrganZerahVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Snake/Species/parts.rsi
  - type: VisualOrganMarkings
