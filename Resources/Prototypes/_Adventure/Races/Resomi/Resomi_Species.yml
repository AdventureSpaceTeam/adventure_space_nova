- type: entity
  id: OrganResomiVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Resomi/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Resomi

- type: entity
