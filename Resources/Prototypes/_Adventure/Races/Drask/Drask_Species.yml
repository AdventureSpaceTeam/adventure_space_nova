- type: marking
  id: FaceDraskBase
  bodyPart: Snout
  forcedColoring: true
  groupWhitelist: [Drask]
  sprites:
  - sprite: _Adventure/Races/Drask/Species/parts.rsi
    state: Face

- type: marking
  id: DraskHeadBase
  bodyPart: HeadSide
  forcedColoring: true
  groupWhitelist: [Drask]
  sprites:
  - sprite: _Adventure/Races/Drask/Species/parts.rsi
    state: head

- type: species
  id: Drask
  name: Драск
  roundStart: true
  prototype: MobDrask
  dollPrototype: AppearanceDrask
  skinColoration: Hues
  defaultSkinTone: "#2888a8"
  minAge: 30
  youngAge: 10000
  oldAge: 50000
  maxAge: 100000
  sexes:
    - Unsexed
  maleFirstNames: NamesDrask
  femaleFirstNames: NamesDrask
  naming: First

- type: markingsGroup
  parent: Undergarments
  id: Drask
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ DraskHeadBase ]
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ FaceDraskBase ]

- type: entity
  id: OrganDraskVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Drask/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Drask

- type: entity
  id: OrganDraskExternal
  abstract: true
  parent: OrganDraskVisual
  components:
  - type: Sprite
    sprite: _Adventure/Races/Drask/Species/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganDraskExternal ]
