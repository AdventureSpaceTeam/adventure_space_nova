- type: marking
  id: PigNoseBase
  bodyPart: Snout
  followSkinColor: true
  forcedColoring: true
  groupWhitelist: [PigMan]
  sprites:
  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: nose_base

- type: marking
  id: PigEarsBase
  bodyPart: HeadSide
  followSkinColor: true
  forcedColoring: true
  groupWhitelist: [PigMan]
  sprites:
  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: ears_base

- type: species
  id: PigMan
  name: Троттин
  roundStart: true
  prototype: MobPigMan
  sprites: MobPigManSprites
  markingLimits: MobPigManMarkingLimits
  dollPrototype: AppearancePigMan
  skinColoration: HumanToned
  minAge: 18
  youngAge: 25
  oldAge: 42
  maxAge: 70

- type: markingsGroup
  parent: Undergarments
  id: PigMan
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      default:
      - PigEarsBase
      limit: 1
      required: true
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      default:
      - PigNoseBase
      limit: 1
      required: true

- type: entity
  id: OrganPigManVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/PigMan/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: PigMan

- type: entity
  id: OrganPigManExternal
  abstract: true
  parent: OrganPigManVisual
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/Species/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganPigManExternal ]
  id: OrganPigManTorso
  components:
  - type: Sprite
    state: torso_m
  - type: VisualOrgan
    data:
      state: torso_m

- type: entity
  parent: [ OrganBaseHead, OrganPigManExternal ]
  id: OrganPigManHead
  components:
  - type: Sprite
    state: head_m
  - type: VisualOrgan
    data:
      state: head_m

- type: entity
  parent: [ OrganBaseArmLeft, OrganPigManExternal ]
  id: OrganPigManArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganPigManExternal ]
  id: OrganPigManArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganPigManExternal ]
  id: OrganPigManHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganPigManExternal ]
  id: OrganPigManHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganPigManExternal ]
  id: OrganPigManLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganPigManExternal ]
  id: OrganPigManLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganPigManExternal ]
  id: OrganPigManFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganPigManExternal ]
  id: OrganPigManFootRight
