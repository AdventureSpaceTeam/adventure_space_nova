  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: nose_base

- type: marking
  id: PigEarsBase
  bodyPart: HeadSide
  followSkinColor: true
  forcedColoring: true
  groupWhitelist: [PigMan]
  sprites:
  - sprite: _Adventure/Races/PigMan/Species/parts.rsi
    state: ears_base

- type: species
