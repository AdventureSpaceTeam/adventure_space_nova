  dollPrototype: MobPigManDummy
  skinColoration: HumanToned
  minAge: 18
  youngAge: 25
  oldAge: 42
  maxAge: 70

- id: PigMan
  limits:
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
