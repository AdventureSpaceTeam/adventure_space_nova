- type: metabolizerType
  id: PigMan
  name: Свинолюд

- type: entity
  id: OrganPigManStomach
  parent: OrganHumanStomach
  name: Желудок троттина
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 100
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 7
  - type: Stomach
    specialDigestible:
      tags:
      - Trash
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [PigMan]

- type: entity
  id: OrganPigManHeart
  parent: OrganHumanHeart
  name: Сердце троттина
  description: тук тук
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Adventure/Races/PigMan/organs.rsi
    state: heart-on
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ PigMan ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
