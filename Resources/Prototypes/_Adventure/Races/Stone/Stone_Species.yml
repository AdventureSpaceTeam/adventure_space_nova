- type: loadoutEffectGroup
  id: StoneOre
  effects:
  - !type:SpeciesLoadoutEffect
    species:
    - Stone

- type: loadout
  id: EmergencyStone
  effects:
  - !type:GroupLoadoutEffect
    proto: StoneOre
  storage:
    back:
    - Coal10

- type: species
  id: Stone
  name: Голем
  roundStart: true
  prototype: MobStone
  dollPrototype: AppearanceStone
  skinColoration: Hues
  defaultSkinTone: "#868991"
  minAge: 1
  youngAge: 100
  oldAge: 25000
  maxAge: 50000
  sexes:
    - Unsexed
  maleFirstNames: NamesStone
  femaleFirstNames: NamesStone
  naming: First

- type: markingsGroup
  parent: Undergarments
  id: Stone
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Back:
      limit: 1
      required: true
      default: [ StoneBase ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false

- type: entity
  id: OrganStoneVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Stone/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Stone

- type: entity
  id: OrganStoneExternal
  abstract: true
  parent: OrganStoneVisual
  components:
  - type: Sprite
    sprite: _Adventure/Races/Stone/Species/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganStoneExternal ]
  id: OrganStoneTorso
  components:
  - type: Sprite
    state: torso_m
  - type: VisualOrgan
    data:
      state: torso_m
    sexStateOverrides:
      Male: torso_m
      Female: torso_f
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Back
      - Tail
      - Overlay
      - Special

