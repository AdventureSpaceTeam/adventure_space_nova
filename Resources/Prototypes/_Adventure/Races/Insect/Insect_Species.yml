- type: marking
  id: InsectHeadBase
  bodyPart: HeadTop
  forcedColoring: true
  groupWhitelist: [InsectSerpentide]
  sprites:
  - sprite: _Adventure/Races/Insect/Customization/head.rsi
    state: base

- type: marking
  id: InsectHandBase
  bodyPart: Back
  forcedColoring: true
  groupWhitelist: [InsectSerpentide]
  sprites:
  - sprite: _Adventure/Races/Insect/Species/parts.rsi
    state: hand

- type: marking
  id: InsectTailBase
  bodyPart: Tail
  forcedColoring: true
  groupWhitelist: [InsectSerpentide]
  sprites:
  - sprite: _Adventure/Races/Insect/Customization/Tails48.rsi
    state: base_tail

- type: species
  id: InsectSerpentide
  name: Серпентид
  roundStart: true
  prototype: MobInsect
  dollPrototype: AppearanceInsectSerpentide
  skinColoration: Hues
  defaultSkinTone: "#835629"
  minAge: 10
  youngAge: 20
  oldAge: 30
  maxAge: 40
  maleFirstNames: NamesInsect
  femaleFirstNames: NamesInsect
  naming: First

- type: markingsGroup
  parent: Undergarments
  id: InsectSerpentide
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Back:
      limit: 1
      required: true
      default: [ InsectHandBase ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ InsectHeadBase ]
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ InsectTailBase ]

- type: entity
  id: OrganInsectVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/Insect/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: InsectSerpentide

- type: entity
  id: OrganInsectExternal
  abstract: true
  parent: OrganInsectVisual
  components:
  - type: Sprite
    sprite: _Adventure/Races/Insect/Species/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganInsectExternal ]
  id: OrganInsectTorso
  components:
  - type: Sprite
    state: torso_m
  - type: VisualOrgan
    data:
      state: torso_m
    sexStateOverrides:
      Male: torso_m
      Female: torso_f
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Back
      - Tail
      - Overlay
      - Special

- type: entity
  parent: [ OrganBaseHead, OrganInsectExternal ]
  id: OrganInsectHead
  components:
  - type: Sprite
    state: head_m
  - type: VisualOrgan
    data:
      state: head_m
    sexStateOverrides:
      Male: head_m
      Female: head_f

- type: entity
  parent: [ OrganBaseArmLeft, OrganInsectExternal ]
  id: OrganInsectArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganInsectExternal ]
  id: OrganInsectArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganInsectExternal ]
  id: OrganInsectHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganInsectExternal ]
  id: OrganInsectHandRight
