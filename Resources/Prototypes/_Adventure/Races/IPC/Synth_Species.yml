- type: species
  id: Synth
  name: КПБ
  roundStart: true
  prototype: MobSynth
  sprites: MobSynthSprites
  markingLimits: MobSynthMarkingLimits
  dollPrototype: AppearanceSynth
  skinColoration: Hues
  defaultSkinTone: "#ebebeb"
  minAge: 1
  youngAge: 2
  oldAge: 499
  maxAge: 500
  sexes:
    - Unsexed
  maleFirstNames: NamesSynth
  femaleFirstNames: NamesSynth
  naming: First

- id: Synth
  limits:
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      default:
      - SynthAntennas
      limit: 1
      required: true
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
  onlyWhitelisted: true
  parent: Undergarments
  type: markingsGroup

- type: entity
  id: OrganSynthVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Adventure/Races/IPC/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Synth

- type: entity
  id: OrganSynthExternal
  abstract: true
  parent: OrganSynthVisual
  components:
  - type: Sprite
    sprite: _Adventure/Races/IPC/Species/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganSynthExternal ]
  id: OrganSynthTorso
  components:
  - type: Sprite
    state: torso_m
  - type: VisualOrgan
    data:
      state: torso_m

- type: entity
  parent: [ OrganBaseHead, OrganSynthExternal ]
  id: OrganSynthHead
  components:
  - type: Sprite
    state: head_m
  - type: VisualOrgan
    data:
      state: head_m

- type: entity
  parent: [ OrganBaseArmLeft, OrganSynthExternal ]
