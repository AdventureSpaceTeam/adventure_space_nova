- type: entity
  save: false
  name: Urist McHands The Felinid
  parent: [BaseMobFelinid, BaseMob]
  id: MobFelinid

- type: entity
  save: false
  name: Urist McHands The Felinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: BaseMobFelinid
  abstract: true
  components:
  - type: TypingIndicator
    proto: Neco
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: OwOAccent
  - type: Speech
    speechVerb: Neco
    allowedEmotes: ['Hissing']
  - type: Vocal
    sounds:
      Male: MaleNeco
      Female: FemaleNeco
      Unsexed: MaleNeco
  - type: MovementSpeedModifier
    weightlessAcceleration: 0.7
    weightlessFriction: 3
    weightlessModifier: 1
  - type: JumpAbility
    action: ActionJumpSpecies
    canCollide: true
    jumpDistance: 2
    jumpSound:
      path: /Audio/Effects/thudswoosh.ogg
      params:
        volume: -1
        variation: 0.05


- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidProfile
    species: Felinid
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganFelinidHeart
      Stomach: OrganFelinidStomach
      Liver: OrganFelinidLiver
      Kidneys: OrganHumanKidneys
  - type: Inventory
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 0.85, 0.85

- type: speechVerb
  id: Neco
  name: chat-speech-verb-name-electricity
  speechVerbStrings:
  - мурчит
  - фыркает
  - мяукает
