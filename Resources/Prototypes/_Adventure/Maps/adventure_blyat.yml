- type: gameMap
  id: AdventureBlyat
  mapName: 'Suka blyat'
  mapPath: /Maps/_Adventure/Adventureblyat.yml
  minPlayers: 0
  maxPlayers: 60
  stations:
    blyat:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} "Блять" {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'KYS'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
        - type: StationJobs
          overflowJobs:
            - Passenger
          availableJobs:
            # service
            Passenger: [ -1, -1 ]
            ServiceWorker: [ 1, 1 ]
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            # engineering
            ChiefEngineer: [ 1, 1 ]
            SeniorEngineerAdv: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 3, 3 ]
            TechnicalAssistant: [ 3, 3 ]
            # medical
            ChiefMedicalOfficer: [ 1, 1 ]
            SeniorMedicAdv : [ 1, 1 ]
            MedicalDoctor: [ 1, 1 ]
            # cargo
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 5, 5 ]
            CargoTechnician: [ 2, 2 ]
            # synth
            Borg: [ 3, 3 ]
