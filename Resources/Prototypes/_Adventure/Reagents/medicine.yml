        - perfluorodecalin-effect-bradycardia
        - perfluorodecalin-effect-echo
        probability: 0.05
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Perfluorodecalin
          min: 4
        showInChat: true
        emote: Gasp
        probability: 0.1
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: Perfluorodecalin
          min: 4
        emote: HeartBeat
        probability: 1

- type: reagent
