        key: Stutter
        component: StutteringAccent
      - !type:Emote
        showInChat: true
        emote: Cough
        probability: 0.1
      - !type:Emote
        showInChat: true
        emote: Gasp
        probability: 0.1
      - !type:GenericStatusEffect
        probability: 0.1
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 5

- type: reagent
  id: Formaldehyde
  name: формальдегид
  group: Medicine
  desc: Вещество, замедляющее разложения трупа, продлевая время для реанимации. Если его проглотит живой, то вместо продления жизни, тот может получить сильнейшую анафилактическую реакцию.
