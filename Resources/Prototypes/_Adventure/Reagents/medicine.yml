- type: reagent
  id: SilverSulfadiazine
  name: сульфадиазин серебра
  group: Medicine
  desc: Вещество, которое нужно наносить на кожу, восстанавливая её от ожогов. Употребление внутрь вызывает интоксикацию.
  physicalDesc: шипучее
  flavor: medicine
  color: "#e9da11"
  reactiveEffects:
    Acidic_Organic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -1 # Убирает 1 ожог за унцию
  metabolisms:
    Poison:
      metabolismRate : 3.00 # В секунду уходит 3 унции реагента
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -2
            Poison: 0.5

