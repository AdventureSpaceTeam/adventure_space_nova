- type: reagent
  id: Perfluorodecalin
  name: перфтордекалин
  group: Medicine
  desc: Вещество, излечивающее от гипоксии. Используется как реагент для некоторых лекарств.
  physicalDesc: масляное
  flavor: medicine
  color: "#b876b4"
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: -4
      - !type:HealthChange
        probability: 0.33 # Шанс 33%
        damage:
          groups:
            Brute: -1
            Burn: -1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Perfluorodecalin
          min: 4
        damage:
          types:
            Asphyxiation: 5.5
            Poison: 1
      - !type:PopupMessage
        conditions:
